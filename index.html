<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* Layout: single-column mobile app, sticky header, bottom tab bar, floating add button; centered 720px column on wide screens */
:root{
  --bg:#f4f7f4; --surface:#ffffff; --surface2:#eef3ef; --fg:#14231a; --muted:#5f7066; --line:#dde6df;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#3fbf7a; --accent-ink:#06210f; --accent-soft:#1b3326; --inc:#4cc985; --exp:#f0806a; --warn:#e3a43b; --warn-soft:#352b14; --bad-soft:#3a1f19; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --surface:#17211b; --surface2:#1e2a23; --fg:#e6efe8; --muted:#97a89d; --line:#2a3830;
  --accent:#3fbf7a; --accent-ink:#06210f; --accent-soft:#1b3326; --inc:#4cc985; --exp:#f0806a; --warn:#e3a43b; --warn-soft:#352b14; --bad-soft:#3a1f19; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}

.list{display:flex;flex-direction:column}

.notice{border-radius:14px;padding:12px 14px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.legend{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.legend .l{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.legend .l span.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:300px}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart line{stroke:var(--line)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:500;min-width:0}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=datetime-local],select,textarea{width:100%;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
input::placeholder{color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg label{position:relative;display:block}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.seg span{display:grid;place-items:center;min-height:42px;border-radius:9px;font-weight:500;font-size:15px;text-align:center;padding:0 6px}
.seg input:checked+span{background:var(--surface);box-shadow:0 0 0 1px var(--line);color:var(--accent);font-weight:600}
.seg input:focus-visible+span{outline:3px solid var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.swatches span{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:2px solid transparent;font-size:20px}
.swatches input:checked+span{border-color:var(--fg)}
.swatches input:focus-visible+span{outline:3px solid var(--accent)}
.err{color:var(--exp);font-size:14px;min-height:1.2em;margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;z-index:25;box-shadow:0 6px 18px rgba(0,0,0,.22)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:24;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{background:none;border:0;border-radius:12px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs button[aria-current=page]{color:var(--accent);background:var(--accent-soft);font-weight:600}
nav.tabs svg{width:24px;height:24px}
#sheet,#dlg{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
#dlg{z-index:50;align-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:relative;background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
#dlg .panel{border-radius:20px;max-width:420px;padding:20px}
.panel h3{margin:0;font-family:var(--f-disp);font-size:18px;font-weight:600}
.panel .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.dlg-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.dlg-actions .btn{flex:1;min-width:120px}
#toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(92vw,520px);background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:15px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.err{background:var(--exp);color:#fff}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-height:64px}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-disp);margin-bottom:4px}
textarea.raw{min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:8px 4px;border-top:1px solid var(--line);text-align:right}
table.t td:first-child,table.t th:first-child{text-align:left}
.tablewrap{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>
</head><body>

<div class="wrap">
  <header class="top">
    <div class="logo" aria-hidden="true">฿</div>
    <div><h1>เงินดีดี</h1><small id="subtitle">ภาพรวม</small></div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<button class="fab" id="fab" data-act="add-tx" aria-label="เพิ่มรายการ"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabs" id="tabs" aria-label="เมนูหลัก"><div class="in"></div></nav>
<div id="sheet" hidden></div>
<div id="dlg" hidden></div>
<div id="toast" role="status" hidden></div>
<input type="file" id="importfile" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';
const KEY='moneydidi.v1', PREV='moneydidi.v1.prev', CORR='moneydidi.v1.corrupt';
const MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const COLORS=['#1f8f55','#2f7fd1','#e0884a','#c95a7a','#8a6fd1','#d1a21f','#2aa8a0','#d2563c','#7a8a3a','#6b7a8f'];
const ICONS=['🍜','🚌','🏠','🛍️','💊','🎬','📚','👨‍👩‍👧','📦','💼','💡','🎁','🏦','☕','🐶','🎮','✈️','🔧','📱','💰'];
const ACC_TYPES=['เงินสด','ธนาคาร','e-Wallet','บัตรเครดิต','ออมทรัพย์/ลงทุน','อื่นๆ'];
const TYPE_TH={income:'รายรับ',expense:'รายจ่าย',transfer:'โอนเงิน'};
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const cents=n=>Math.round(n*100);
const M=c=>(c<0?'−':'')+'฿'+(Math.abs(c)/100).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const p2=n=>String(n).padStart(2,'0');
function nowLocal(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())}
const todayStr=()=>nowLocal().slice(0,10);
const monthLabel=m=>MONTHS[+m.slice(5,7)-1]+' '+(+m.slice(0,4)+543);
function shiftMonth(m,d){let y=+m.slice(0,4),mo=+m.slice(5,7)-1+d;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+'-'+p2(mo+1)}
const dateLabel=s=>(+s.slice(8,10))+' '+MS[+s.slice(5,7)-1]+' '+(+s.slice(0,4)+543);

/* ---------- storage ---------- */
let S, locked=false, memOnly=false, prevMem=null, corruptRaw=null;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function emptyState(){
  const cat=(name,kind,icon,ci)=>({id:uid()+ci,name,kind,icon,color:COLORS[ci%COLORS.length]});
  return {app:'moneydidi',version:1,meta:{created:new Date().toISOString(),lastBackup:null},
    accounts:[{id:uid()+'a',name:'เงินสด',type:'เงินสด',opening:0},{id:uid()+'b',name:'บัญชีธนาคาร',type:'ธนาคาร',opening:0}],
    categories:[cat('อาหารและเครื่องดื่ม','expense','🍜',2),cat('เดินทาง','expense','🚌',1),cat('ที่พักและค่าสาธารณูปโภค','expense','🏠',6),cat('ช้อปปิ้ง','expense','🛍️',3),cat('สุขภาพ','expense','💊',7),cat('บันเทิง','expense','🎬',4),cat('การศึกษา','expense','📚',5),cat('ครอบครัว','expense','👨‍👩‍👧',8),cat('อื่นๆ','expense','📦',9),
      cat('เงินเดือน','income','💼',0),cat('รายได้เสริม','income','💡',5),cat('โบนัส','income','🎁',2),cat('ดอกเบี้ย','income','🏦',1),cat('อื่นๆ','income','📦',9)],
    txs:[],plans:[]};
}
const bad=e=>({ok:false,error:e});
const okMoney=v=>typeof v==='number'&&isFinite(v)&&Math.abs(v)<1e12&&Math.abs(v*100-Math.round(v*100))<1e-6;
const okStr=(v,max)=>typeof v==='string'&&v.length>0&&v.length<=max;
const dtRe=/^\d{4}-\d\d-\d\dT\d\d:\d\d$/, dRe=/^\d{4}-\d\d-\d\d$/;
function validateState(o){
  if(!o||typeof o!=='object'||Array.isArray(o))return bad('รูปแบบไฟล์ไม่ถูกต้อง');
  if(o.app!=='moneydidi')return bad('ไม่ใช่ไฟล์สำรองของเงินดีดี');
  if(!Number.isInteger(o.version)||o.version>1)return bad('ไฟล์นี้มาจากเวอร์ชันที่แอปนี้ยังไม่รองรับ');
  for(const k of ['accounts','categories','txs','plans'])if(!Array.isArray(o[k]))return bad('ข้อมูลส่วน "'+k+'" ขาดหายหรือเสียหาย');
  const acc=new Set(),cat=new Map(),plan=new Set(),ids=new Set();
  for(const a of o.accounts){if(!a||!okStr(a.id,60)||!okStr(a.name,60)||!okMoney(a.opening)||acc.has(a.id))return bad('ข้อมูลบัญชีไม่ถูกต้อง');acc.add(a.id)}
  if(!acc.size)return bad('ไม่มีบัญชีในไฟล์');
  for(const c of o.categories){if(!c||!okStr(c.id,60)||!okStr(c.name,60)||!['income','expense'].includes(c.kind)||cat.has(c.id))return bad('ข้อมูลหมวดหมู่ไม่ถูกต้อง');cat.set(c.id,c.kind)}
  for(const p of o.plans){if(!p||!okStr(p.id,60)||!okStr(p.name,60)||!['budget','saving'].includes(p.kind)||!okMoney(p.limit)||p.limit<=0||!dRe.test(p.start||'')||!dRe.test(p.end||'')||plan.has(p.id))return bad('ข้อมูลแผนไม่ถูกต้อง');plan.add(p.id)}
  for(const t of o.txs){
    if(!t||!okStr(t.id,60)||ids.has(t.id)||!['income','expense','transfer'].includes(t.type)||!okMoney(t.amount)||t.amount<=0||!dtRe.test(t.date||'')||!acc.has(t.accountId))return bad('พบรายการที่ข้อมูลไม่ถูกต้อง');
    ids.add(t.id);
    if(t.type==='transfer'){if(!acc.has(t.toAccountId)||t.toAccountId===t.accountId)return bad('พบรายการโอนที่ไม่ถูกต้อง')}
    else if(cat.get(t.categoryId)!==t.type)return bad('พบรายการที่หมวดหมู่ไม่ตรงกัน');
    if(t.planId&&!plan.has(t.planId))return bad('พบรายการที่อ้างถึงแผนซึ่งไม่มีอยู่');
  }
  return {ok:true};
}
function normalize(o){
  const r2=n=>Math.round(n*100)/100;
  return {app:'moneydidi',version:1,meta:{created:(o.meta&&o.meta.created)||new Date().toISOString(),lastBackup:(o.meta&&o.meta.lastBackup)||null},
    accounts:o.accounts.map(a=>({id:a.id,name:a.name,type:ACC_TYPES.includes(a.type)?a.type:'อื่นๆ',opening:r2(a.opening)})),
    categories:o.categories.map(c=>({id:c.id,name:c.name,kind:c.kind,icon:typeof c.icon==='string'&&c.icon?c.icon.slice(0,8):'📦',color:/^#[0-9a-fA-F]{6}$/.test(c.color||'')?c.color:COLORS[9]})),
    plans:o.plans.map(p=>({id:p.id,name:p.name,kind:p.kind,limit:r2(p.limit),start:p.start,end:p.end})),

/* ---------- calculations (all in satang) ---------- */
const catOf=id=>S.categories.find(c=>c.id===id)||{id,name:'(หมวดที่ถูกลบ)',icon:'❔',color:'#6b7a8f',kind:'expense'};
const accOf=id=>S.accounts.find(a=>a.id===id)||{id,name:'(บัญชีที่ถูกลบ)'};
function agg(list){let i=0,e=0;for(const t of list){const c=cents(t.amount);if(t.type==='income')i+=c;else if(t.type==='expense')e+=c}return{i,e,n:i-e}}
function balances(){
  const b={};for(const a of S.accounts)b[a.id]=cents(a.opening);
  for(const t of S.txs){const c=cents(t.amount);
    if(t.type==='income'&&t.accountId in b)b[t.accountId]+=c;
    else if(t.type==='expense'&&t.accountId in b)b[t.accountId]-=c;
    else if(t.type==='transfer'){if(t.accountId in b)b[t.accountId]-=c;if(t.toAccountId in b)b[t.toAccountId]+=c}}
  return b;
}
function verify(){
  const b=balances();let tot=0;for(const k in b)tot+=b[k];
  const g=agg(S.txs);let open=0;for(const a of S.accounts)open+=cents(a.opening);
  const exp=open+g.i-g.e;
  return {ok:tot===exp,total:tot,expected:exp};
}
function breakdown(list,kind){
  const m={};for(const t of list)if(t.type===kind)m[t.categoryId]=(m[t.categoryId]||0)+cents(t.amount);
  return Object.entries(m).map(([id,c])=>({id,c})).sort((a,b)=>b.c-a.c);
}
function planUse(p){
  const want=p.kind==='budget'?'expense':'income';let used=0,n=0;
  for(const t of S.txs)if(t.planId===p.id&&t.type===want){used+=cents(t.amount);n++}
  const limit=cents(p.limit);return{used,n,limit,pct:limit?used/limit*100:0,left:limit-used};
}
function planState(p){
  const u=planUse(p);
  if(p.kind==='budget')return u.pct>100?'bad':u.pct>=80?'warn':'ok';
  return u.pct>=100?'ok':'ok';
}
function daysInfo(p){
  const t=new Date(todayStr()+'T00:00:00'),s=new Date(p.start+'T00:00:00'),e=new Date(p.end+'T00:00:00');
  if(t<s)return{txt:'เริ่ม '+dateLabel(p.start),left:null};
  if(t>e)return{txt:'สิ้นสุดแล้ว',left:0};
  const left=Math.round((e-t)/864e5)+1;return{txt:'เหลืออีก '+left+' วัน',left};
}
function backupDue(){
  const ref=S.meta.lastBackup||S.meta.created;
  const days=(Date.now()-new Date(ref).getTime())/864e5;
  return S.txs.length>0&&days>=7;
}

/* ---------- forms ---------- */
function parseMoney(s,neg){
  s=String(s).replace(/[,\s฿]/g,'');
  if(!(neg?/^-?\d{1,12}(\.\d{1,2})?$/:/^\d{1,12}(\.\d{1,2})?$/).test(s))return null;
  return Math.round(parseFloat(s)*100)/100;
}

  if(locked){toast('โหมดป้องกันข้อมูลเปิดอยู่ ยังเพิ่มรายการไม่ได้ ไปที่ เพิ่มเติม > สำรองและกู้คืนข้อมูล','err');return}
  const isNew=!t;t=t||{type:forceType||'expense',date:nowLocal(),amount:'',accountId:S.accounts[0].id,toAccountId:(S.accounts[1]||S.accounts[0]).id,note:'',planId:'',categoryId:''};

   +'<label class="f" id="row-cat">หมวดหมู่<select id="f-cat" data-sel="'+esc(t.categoryId||'')+'"></select></label>'
   +'<label class="f"><span id="lbl-acc">บัญชี</span><select id="f-acc">'+opts(S.accounts,t.accountId,a=>a.id,a=>a.name)+'</select></label>'

   +'<label class="f" id="row-plan"><span id="lbl-plan">แผน</span><select id="f-plan" data-sel="'+esc(t.planId||'')+'"></select></label>'

   +'<p class="err" id="f-err" role="alert"></p><button class="btn primary block" type="submit" id="f-save">บันทึก</button>'
   +(isNew?'':'<button class="btn danger block" type="button" data-act="del-tx" data-id="'+t.id+'">ลบรายการนี้</button>')+'</form>');

function syncTxForm(){
  const f=$('#txform');if(!f)return;
  const type=f.querySelector('input[name=type]:checked').value,cs=$('#f-cat'),ps=$('#f-plan');
  $('#row-cat').hidden=type==='transfer';$('#row-to').hidden=type!=='transfer';$('#row-plan').hidden=type==='transfer';
  $('#lbl-acc').textContent=type==='transfer'?'จากบัญชี':'บัญชี';
  const curC=cs.value||cs.dataset.sel,cats=S.categories.filter(c=>c.kind===type);
  cs.innerHTML=cats.map(c=>'<option value="'+c.id+'">'+esc(c.icon+' '+c.name)+'</option>').join('');
  if(cats.some(c=>c.id===curC))cs.value=curC;
  const want=type==='expense'?'budget':'saving',curP=ps.value||ps.dataset.sel,plans=S.plans.filter(p=>p.kind===want);
  ps.innerHTML='<option value="">ไม่ผูกกับแผน</option>'+plans.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');
  if(plans.some(p=>p.id===curP))ps.value=curP;
  cs.dataset.sel='';ps.dataset.sel='';
  $('#lbl-plan').textContent=type==='expense'?'ผูกกับงบประมาณ (ถ้ามี)':'ผูกกับเป้าหมายเก็บเงิน (ถ้ามี)';
}
function guard(){if(busy)return false;busy=true;setTimeout(()=>{busy=false},700);return true}
function submitTx(){
  const f=$('#txform'),err=$('#f-err'),btn=$('#f-save');
  const type=f.querySelector('input[name=type]:checked').value,amount=parseMoney($('#f-amount').value),date=$('#f-date').value;
  const accountId=$('#f-acc').value,toAccountId=$('#f-to').value,categoryId=$('#f-cat').value,planId=$('#f-plan').value,note=$('#f-note').value.trim();
  const fail=m=>{err.textContent=m};
  if(amount==null)return fail('กรุณากรอกจำนวนเงินเป็นตัวเลขมากกว่า 0 (ทศนิยมไม่เกิน 2 ตำแหน่ง)');
  if(amount<=0)return fail('จำนวนเงินต้องมากกว่า 0');
  if(!dtRe.test(date)||isNaN(new Date(date)))return fail('กรุณาเลือกวันที่และเวลาให้ถูกต้อง');
  const yr=+date.slice(0,4);if(yr<2000||yr>2100)return fail('ปีของวันที่ไม่สมเหตุสมผล');
  if(!S.accounts.some(a=>a.id===accountId))return fail('กรุณาเลือกบัญชี');
  if(type==='transfer'){if(!S.accounts.some(a=>a.id===toAccountId))return fail('กรุณาเลือกบัญชีปลายทาง');if(toAccountId===accountId)return fail('บัญชีต้นทางและปลายทางต้องเป็นคนละบัญชี')}
  else if(!S.categories.some(c=>c.id===categoryId&&c.kind===type))return fail('กรุณาเลือกหมวดหมู่');
  if(!guard())return;
  err.textContent='';btn.disabled=true;
  const id=f.dataset.id||uid();
  const obj={id,type,amount,date,categoryId:type==='transfer'?null:categoryId,accountId,toAccountId:type==='transfer'?toAccountId:null,note,planId:type==='transfer'?null:(planId||null)};
  const was=f.dataset.id;
  const ok=commit(()=>{if(was){const i=S.txs.findIndex(x=>x.id===was);if(i<0)throw new Error('ไม่พบรายการเดิม');S.txs[i]=obj}else S.txs.push(obj)});
  if(!ok){btn.disabled=false;return}
  closeSheet();render();
  let msg=was?'แก้ไขรายการแล้ว':'บันทึกรายการแล้ว',kind='';
  const v=verify();if(!v.ok){msg='บันทึกแล้ว แต่ยอดรวมไม่ตรงกัน กรุณาตรวจสอบที่หน้าบัญชี';kind='err'}
  else{
    const bal=balances()[accountId];
    if(type!=='income'&&bal<0){msg+=' · ยอดบัญชี “'+accOf(accountId).name+'” ติดลบ '+M(-bal);kind='err'}
    if(planId&&type==='expense'){const p=S.plans.find(x=>x.id===planId),u=planUse(p);if(u.pct>100){msg+=' · เกินงบ “'+p.name+'” แล้ว';kind='err'}else if(u.pct>=80){msg+=' · ใกล้เต็มงบ “'+p.name+'” ('+u.pct.toFixed(0)+'%)';kind='err'}}
  }
  toast(msg,kind);
}
async function delTx(id){
  const t=S.txs.find(x=>x.id===id);if(!t)return;
  const ok=await confirmDlg('ลบรายการนี้?','<b>'+(t.type==='transfer'?'โอนเงิน':esc(catOf(t.categoryId).name))+'</b> '+M(cents(t.amount))+'<br><span class="muted small">ลบแล้วกู้คืนไม่ได้ (นอกจากนำเข้าไฟล์สำรอง)</span>','ลบรายการ',true);
  if(!ok)return;
  if(commit(()=>{S.txs=S.txs.filter(x=>x.id!==id)})){closeSheet();render();toast('ลบรายการแล้ว')}
}

  $('#a-name').focus();

function submitAcc(){
  const f=$('#accform'),err=$('#f-err'),name=$('#a-name').value.trim(),type=$('#a-type').value,open=parseMoney($('#a-open').value||'0',true),id=f.dataset.id;
  if(!name)return err.textContent='กรุณาตั้งชื่อบัญชี';
  if(S.accounts.some(a=>a.id!==id&&a.name===name))return err.textContent='มีบัญชีชื่อนี้อยู่แล้ว';
  if(open==null)return err.textContent='ยอดตั้งต้นต้องเป็นตัวเลข (ทศนิยมไม่เกิน 2 ตำแหน่ง)';
  if(!guard())return;
  const ok=commit(()=>{if(id){const a=S.accounts.find(x=>x.id===id);a.name=name;a.type=type;a.opening=open}else S.accounts.push({id:uid(),name,type,opening:open})});
  if(ok){closeSheet();render();toast(id?'แก้ไขบัญชีแล้ว':'เพิ่มบัญชีแล้ว')}
}
async function delAcc(id){
  const n=S.txs.filter(t=>t.accountId===id||t.toAccountId===id).length;
  if(S.accounts.length<=1){toast('ต้องมีอย่างน้อย 1 บัญชี','err');return}
  if(n){await dialog({title:'ลบบัญชีนี้ไม่ได้',msg:'บัญชีนี้มี '+n+' รายการที่ใช้งานอยู่ เพื่อไม่ให้ยอดเงินคลาดเคลื่อน กรุณาแก้ไขหรือลบรายการเหล่านั้นก่อน (กรองดูได้ที่แท็บรายการ)',buttons:[{id:'ok',label:'เข้าใจแล้ว',cls:'primary'}]});return}
  if(!await confirmDlg('ลบบัญชีนี้?','ลบบัญชี “'+esc(accOf(id).name)+'” (ไม่มีรายการใช้งาน)','ลบบัญชี',true))return;
  if(commit(()=>{S.accounts=S.accounts.filter(a=>a.id!==id)})){closeSheet();render();toast('ลบบัญชีแล้ว')}
}
function openCat(c){
  const isNew=!c;c=c||{name:'',kind:ui.catKind,icon:ICONS[0],color:COLORS[0]};
  openSheet(isNew?'เพิ่มหมวดหมู่':'แก้ไขหมวดหมู่','<form id="catform" class="stack" data-id="'+(isNew?'':c.id)+'" data-kind="'+c.kind+'" novalidate><label class="f">ชื่อหมวดหมู่ ('+(c.kind==='income'?'รายรับ':'รายจ่าย')+')<input type="text" id="c-name" maxlength="30" autocomplete="off" value="'+esc(c.name)+'"></label><div class="f"><b style="font-weight:500;font-size:14px">ไอคอน</b><div class="swatches">'+ICONS.map(i=>'<label><input type="radio" name="icon" value="'+i+'"'+(i===c.icon?' checked':'')+'><span style="background:var(--surface2)">'+i+'</span></label>').join('')+'</div></div><div class="f"><b style="font-weight:500;font-size:14px">สี</b><div class="swatches">'+COLORS.map(k=>'<label><input type="radio" name="color" value="'+k+'"'+(k===c.color?' checked':'')+' aria-label="สี '+k+'"><span style="background:'+k+'"></span></label>').join('')+'</div></div><p class="err" id="f-err" role="alert"></p><button class="btn primary block" type="submit" id="f-save">บันทึก</button>'+(isNew?'':'<button class="btn danger block" type="button" data-act="del-cat" data-id="'+c.id+'">ลบหมวดหมู่นี้</button>')+'</form>');
  $('#c-name').focus();
}
function submitCat(){
  const f=$('#catform'),err=$('#f-err'),name=$('#c-name').value.trim(),kind=f.dataset.kind,id=f.dataset.id;
  const icon=(f.querySelector('input[name=icon]:checked')||{}).value||'📦',color=(f.querySelector('input[name=color]:checked')||{}).value||COLORS[0];
  if(!name)return err.textContent='กรุณาตั้งชื่อหมวดหมู่';
  if(S.categories.some(c=>c.id!==id&&c.kind===kind&&c.name===name))return err.textContent='มีหมวดหมู่ชื่อนี้อยู่แล้ว';
  if(!guard())return;
  const ok=commit(()=>{if(id){const c=S.categories.find(x=>x.id===id);c.name=name;c.icon=icon;c.color=color}else S.categories.push({id:uid(),name,kind,icon,color})});
  if(ok){closeSheet();render();toast(id?'แก้ไขหมวดหมู่แล้ว':'เพิ่มหมวดหมู่แล้ว')}
}
async function delCat(id){
  const c=S.categories.find(x=>x.id===id),others=S.categories.filter(x=>x.kind===c.kind&&x.id!==id),n=S.txs.filter(t=>t.categoryId===id).length;
  if(!others.length){toast('ต้องเหลือหมวดหมู่'+(c.kind==='income'?'รายรับ':'รายจ่าย')+'อย่างน้อย 1 หมวด','err');return}
  if(!n){if(!await confirmDlg('ลบหมวดหมู่นี้?','ลบหมวดหมู่ “'+esc(c.name)+'” (ไม่มีรายการใช้งาน)','ลบหมวดหมู่',true))return;
    if(commit(()=>{S.categories=S.categories.filter(x=>x.id!==id)})){closeSheet();render();toast('ลบหมวดหมู่แล้ว')}return}
  const r=await dialog({title:'หมวดหมู่นี้ยังมีรายการใช้งาน',msg:'“'+esc(c.name)+'” มี <b>'+n+'</b> รายการ หากลบ ต้องย้ายรายการเหล่านี้ไปหมวดหมู่อื่นก่อน',extra:'<label class="f">ย้ายไปหมวดหมู่<select id="mv">'+opts(others,'',x=>x.id,x=>x.icon+' '+x.name)+'</select></label>',buttons:[{id:'no',label:'ยกเลิก'},{id:'yes',label:'ย้ายแล้วลบ',cls:'danger'}]});
  if(r.id!=='yes')return;
  if(commit(()=>{for(const t of S.txs)if(t.categoryId===id)t.categoryId=r.value;S.categories=S.categories.filter(x=>x.id!==id)})){closeSheet();render();toast('ย้าย '+n+' รายการและลบหมวดหมู่แล้ว')}
}
function openPlan(p){
  const isNew=!p;const d=todayStr();p=p||{name:'',kind:'budget',limit:'',start:d.slice(0,8)+'01',end:shiftMonth(d.slice(0,7),0)+'-'+p2(new Date(+d.slice(0,4),+d.slice(5,7),0).getDate())};
  openSheet(isNew?'สร้างแผน':'แก้ไขแผน','<form id="planform" class="stack" data-id="'+(isNew?'':p.id)+'" novalidate><div class="seg"><label><input type="radio" name="pk" value="budget"'+(p.kind==='budget'?' checked':'')+'><span>งบใช้จ่าย</span></label><label><input type="radio" name="pk" value="saving"'+(p.kind==='saving'?' checked':'')+'><span>เป้าหมายเก็บเงิน</span></label></div><p class="muted small" style="margin:0">งบใช้จ่ายนับรายจ่ายที่ผูกกับแผน เป้าหมายเก็บเงินนับรายรับที่ผูกกับแผน</p><label class="f">ชื่อแผน<input type="text" id="p-name" maxlength="40" autocomplete="off" placeholder="เช่น งบอาหารเดือนนี้, เก็บเงินเที่ยว" value="'+esc(p.name)+'"></label><label class="f">วงเงิน / เป้าหมาย (บาท)<input type="text" id="p-limit" inputmode="decimal" autocomplete="off" value="'+esc(p.limit)+'"></label><div class="grid2"><label class="f">เริ่ม<input type="date" id="p-start" value="'+p.start+'"></label><label class="f">สิ้นสุด<input type="date" id="p-end" value="'+p.end+'"></label></div><p class="err" id="f-err" role="alert"></p><button class="btn primary block" type="submit" id="f-save">บันทึก</button>'+(isNew?'':'<button class="btn danger block" type="button" data-act="del-plan" data-id="'+p.id+'">ลบแผนนี้</button>')+'</form>');
}
function submitPlan(){
  const f=$('#planform'),err=$('#f-err'),id=f.dataset.id,kind=f.querySelector('input[name=pk]:checked').value,name=$('#p-name').value.trim(),limit=parseMoney($('#p-limit').value),start=$('#p-start').value,end=$('#p-end').value;
  if(!name)return err.textContent='กรุณาตั้งชื่อแผน';
  if(limit==null||limit<=0)return err.textContent='กรุณากรอกวงเงินเป็นตัวเลขมากกว่า 0';
  if(!dRe.test(start)||!dRe.test(end))return err.textContent='กรุณาเลือกวันที่เริ่มและสิ้นสุด';
  if(end<start)return err.textContent='วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่ม';
  if(id){const old=S.plans.find(x=>x.id===id);if(old.kind!==kind&&S.txs.some(t=>t.planId===id))return err.textContent='แผนนี้มีรายการผูกอยู่ จึงเปลี่ยนชนิดแผนไม่ได้'}
  if(!guard())return;
  const ok=commit(()=>{if(id){const p=S.plans.find(x=>x.id===id);Object.assign(p,{name,kind,limit,start,end})}else S.plans.push({id:uid(),name,kind,limit,start,end})});
  if(ok){closeSheet();render();toast(id?'แก้ไขแผนแล้ว':'สร้างแผนแล้ว')}
}
async function delPlan(id){
  const n=S.txs.filter(t=>t.planId===id).length;
  if(!await confirmDlg('ลบแผนนี้?','จะลบแผน “'+esc(S.plans.find(p=>p.id===id).name)+'” '+(n?'และปลดการผูกออกจาก '+n+' รายการ (รายการยังอยู่ครบ)':''),'ลบแผน',true))return;
  if(commit(()=>{for(const t of S.txs)if(t.planId===id)t.planId=null;S.plans=S.plans.filter(p=>p.id!==id)})){closeSheet();render();toast('ลบแผนแล้ว')}
}

/* ---------- backup / export ---------- */
let dl;
async function getDl(){if(dl!==undefined)return dl;
  if(!window.claude){dl={save:async({filename,data})=>{const u=URL.createObjectURL(new Blob([data],{type:filename.endsWith('.csv')?'text/csv;charset=utf-8':'application/json'}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return{status:'saved'}}};return dl}
  try{dl=window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}return dl}
async function saveFile(filename,data){
  const d=await getDl();if(!d)return 'unavailable';
  try{await d.save({filename,data});return 'saved'}catch(e){return (e&&e.code)||'error'}
}
function showText(title,hint,text){
  openSheet(title,'<div class="stack"><p class="muted small" style="margin:0">'+esc(hint)+'</p><textarea class="raw" id="rawtxt" readonly></textarea><button class="btn primary block" data-act="copy-raw">คัดลอกข้อความ</button></div>');
  $('#rawtxt').value=text||'';
}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true}catch(e){return false}}
function backupJson(){return JSON.stringify(Object.assign({},S,{exportedAt:new Date().toISOString()}),null,1)}
async function exportJson(){
  if(locked){toast('ยังส่งออกไม่ได้ในโหมดป้องกันข้อมูลเสียหาย','err');return}
  const text=backupJson(),name='moneydidi-backup-'+todayStr()+'.json',r=await saveFile(name,text);
  if(r==='saved'){commit(()=>{S.meta.lastBackup=new Date().toISOString()});render();toast('บันทึกไฟล์สำรองแล้ว: '+name)}
  else if(r==='declined')toast('ยกเลิกการบันทึกไฟล์สำรอง');
  else showText('ข้อมูลสำรอง','มุมมองนี้ดาวน์โหลดไฟล์โดยตรงไม่ได้ กรุณาคัดลอกข้อความนี้ไปวางเก็บในไฟล์ .json (เช่นในบันทึกหรืออีเมลถึงตัวเอง)',text);
}
async function copyJson(){
  if(locked)return;
  const text=backupJson();
  if(await copyText(text)){toast('คัดลอกข้อมูลสำรองแล้ว นำไปวางเก็บไว้ในที่ปลอดภัย')}
  else showText('ข้อมูลสำรอง','คัดลอกอัตโนมัติไม่ได้ กดค้างที่ข้อความแล้วเลือกคัดลอกทั้งหมด',text);
}
function csvCell(v){let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;if(/[",\n\r]/.test(s))s='"'+s.replace(/"/g,'""')+'"';return s}
function buildCsv(list){
  const rows=[['วันที่','เวลา','ประเภท','หมวดหมู่','บัญชี','บัญชีปลายทาง','จำนวนเงิน','รายละเอียด','แผน']];
  const sorted=list.slice().sort((a,b)=>a.date<b.date?-1:1);
  for(const t of sorted){const pl=t.planId?(S.plans.find(p=>p.id===t.planId)||{}).name:'';rows.push([t.date.slice(0,10),t.date.slice(11),TYPE_TH[t.type],t.type==='transfer'?'':catOf(t.categoryId).name,accOf(t.accountId).name,t.type==='transfer'?accOf(t.toAccountId).name:'',t.amount.toFixed(2),t.note,pl||''])}
  return '\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
}
async function exportCsv(scope){
  const list=scope==='all'?S.txs:S.txs.filter(t=>t.date.startsWith(ui.month));
  if(!list.length){toast('ไม่มีรายการให้ส่งออก','err');return}
  const text=buildCsv(list),name='moneydidi-'+(scope==='all'?'all':ui.month)+'.csv',r=await saveFile(name,text);
  if(r==='saved')toast('บันทึกไฟล์ CSV แล้ว ('+list.length+' รายการ)');
  else if(r==='declined')toast('ยกเลิกการบันทึกไฟล์');
  else{showText('ข้อมูล CSV','มุมมองนี้ดาวน์โหลดไฟล์โดยตรงไม่ได้ คัดลอกข้อความนี้ไปวางในไฟล์ .csv หรือวางใน Google Sheets ได้',text)}
}
function persistPrev(){
  const snap=JSON.stringify({savedAt:new Date().toISOString(),state:S});prevMem=snap;
  if(memOnly)return true;return lsSet(PREV,snap);
}
async function importFile(file){
  if(!file)return;
  if(file.size>15*1024*1024){toast('ไฟล์ใหญ่เกินไป','err');return}
  let o;
  try{o=JSON.parse(await file.text())}catch(e){toast('อ่านไฟล์ไม่ได้ ไฟล์ไม่ใช่ JSON ที่ถูกต้อง ข้อมูลเดิมไม่เปลี่ยนแปลง','err');return}
  const v=validateState(o);
  if(!v.ok){toast('นำเข้าไม่ได้: '+v.error+' ข้อมูลเดิมไม่เปลี่ยนแปลง','err');return}
  const n=normalize(o);
  const r=await dialog({title:'นำเข้าข้อมูลจากไฟล์?',msg:'ไฟล์: <b>'+n.txs.length+'</b> รายการ, '+n.accounts.length+' บัญชี, '+n.plans.length+' แผน'+(o.exportedAt?'<br>สำรองเมื่อ '+dateLabel(String(o.exportedAt).slice(0,10)):'')+'<br><br>ข้อมูลปัจจุบัน ('+(locked?'อ่านไม่ได้':S.txs.length+' รายการ')+') <b>จะถูกแทนที่</b> ระบบจะเก็บสำเนาไว้ในเครื่องและขอให้คุณบันทึกไฟล์สำรองของข้อมูลเดิมก่อน',buttons:[{id:'no',label:'ยกเลิก'},{id:'yes',label:'สำรองเดิมแล้วนำเข้า',cls:'primary'}]});
  if(r.id!=='yes')return;
  if(!locked){
    if(!persistPrev()){toast('เก็บสำเนาข้อมูลเดิมไม่สำเร็จ จึงยังไม่นำเข้า ข้อมูลเดิมไม่เปลี่ยนแปลง','err');return}
    if(S.txs.length){const res=await saveFile('moneydidi-before-import-'+todayStr()+'.json',backupJson());
      if(res!=='saved')toast('ไม่ได้บันทึกไฟล์สำรองเดิม แต่เก็บสำเนาไว้ในเครื่องแล้ว (กู้คืนได้จากหน้าสำรองข้อมูล)')}
  }
  const old=S,oldLocked=locked;S=n;locked=false;
  if(!save()){S=old;locked=oldLocked;render();return}
  ui.sub=null;ui.view='home';closeSheet();render();toast('นำเข้าข้อมูลสำเร็จ '+n.txs.length+' รายการ');
}
async function restorePrev(){
  const raw=prevMem||lsGet(PREV);if(!raw)return;
  let o;try{o=JSON.parse(raw).state}catch(e){toast('อ่านสำเนาเดิมไม่ได้','err');return}
  const v=validateState(o);if(!v.ok){toast('สำเนาเดิมเสียหาย','err');return}
  if(!await confirmDlg('กู้คืนข้อมูลก่อนนำเข้า?','จะแทนที่ข้อมูลปัจจุบันด้วยสำเนา ('+o.txs.length+' รายการ)','กู้คืน'))return;
  const old=S;S=normalize(o);if(!save()){S=old;render();return}
  render();toast('กู้คืนข้อมูลแล้ว');
}
async function startFresh(){
  if(!await confirmDlg('เริ่มใช้งานใหม่?','จะเริ่มด้วยข้อมูลว่าง ข้อมูลเดิมที่อ่านไม่ได้ยังเก็บสำเนาไว้ในเครื่อง (ไม่ถูกลบ)','เริ่มใหม่',true))return;
  locked=false;S=emptyState();if(save()){ui.sub=null;ui.view='home';render();toast('เริ่มต้นใหม่แล้ว')}else{locked=true}
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'nav':ui.view=el.dataset.v;ui.sub=null;render();window.scrollTo(0,0);break;
    case 'go-sub':ui.sub=el.dataset.sub;ui.view='more';render();window.scrollTo(0,0);break;
    case 'back':ui.sub=null;render();break;
    case 'm-prev':ui.month=shiftMonth(ui.month,-1);render();break;
    case 'm-next':ui.month=shiftMonth(ui.month,1);render();break;
    case 'toggle-all':ui.txAll=!ui.txAll;render();break;
    case 'ck':ui.catKind=el.value;render();break;
    case 'close-sheet':closeSheet();break;
    case 'add-tx':openTx();break;
    case 'add-transfer':openTx(null,'transfer');break;
    case 'edit-tx':openTx(S.txs.find(t=>t.id===id));break;
    case 'del-tx':delTx(id);break;
    case 'add-acc':openAcc();break;
    case 'edit-acc':openAcc(S.accounts.find(x=>x.id===id));break;
    case 'del-acc':delAcc(id);break;
    case 'add-cat':openCat();break;
    case 'edit-cat':openCat(S.categories.find(x=>x.id===id));break;
    case 'del-cat':delCat(id);break;
    case 'add-plan':openPlan();break;
    case 'edit-plan':openPlan(S.plans.find(x=>x.id===id));break;
    case 'del-plan':delPlan(id);break;
    case 'export-json':exportJson();break;
    case 'copy-json':copyJson();break;
    case 'export-csv':exportCsv(el.dataset.scope);break;
    case 'import-json':$('#importfile').click();break;
    case 'restore-prev':restorePrev();break;
    case 'start-fresh':startFresh();break;
    case 'show-raw':showText('ข้อมูลดิบที่อ่านไม่ได้','ข้อความนี้คือข้อมูลเดิมที่ระบบอ่านไม่ได้ เก็บไว้เผื่อกู้คืนด้วยตนเอง',corruptRaw||'');break;
    case 'copy-raw':{const t=$('#rawtxt');if(await copyText(t.value))toast('คัดลอกแล้ว');else{t.select();toast('กดค้างแล้วเลือกคัดลอกด้วยตนเอง')}break}
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  ({txform:submitTx,accform:submitAcc,catform:submitCat,planform:submitPlan}[e.target.id]||(()=>{}))();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='type'&&t.closest('#txform'))syncTxForm();
  if(t.id==='flt-type'){ui.f.type=t.value;$('#txlist').innerHTML=txListHtml()}
  if(t.id==='flt-cat'){ui.f.cat=t.value;$('#txlist').innerHTML=txListHtml()}
  if(t.id==='flt-acc'){ui.f.acc=t.value;$('#txlist').innerHTML=txListHtml()}
  if(t.id==='importfile'){const f=t.files[0];t.value='';importFile(f)}
});
document.addEventListener('input',e=>{if(e.target.id==='flt-q'){ui.f.q=e.target.value;$('#txlist').innerHTML=txListHtml()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#dlg').hidden)return;if(!$('#sheet').hidden)closeSheet()}});

if('serviceWorker' in navigator&&!window.claude&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();render();
window.__md={get S(){return S},ui,verify,balances,validateState,buildCsv,get locked(){return locked}};
if(locked)setTimeout(()=>toast('อ่านข้อมูลเดิมไม่ได้ ระบบจึงไม่เขียนทับ ไปที่ เพิ่มเติม > สำรองและกู้คืนข้อมูล','err'),300);
})();
</script>
